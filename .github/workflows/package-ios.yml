name: Build iOS Packages

# Signed IPA uploaded to TestFlight. Manual only: the app must exist in
# App Store Connect before this can succeed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLUTION_FILE: src/SmsTicket.slnx
  PROJECT_PATH: src/SmsTicket
  PROJECT_FILE: src/SmsTicket/SmsTicket.csproj
  TFM: net10.0-ios
  VERSION_CODE_BASE: 500001

jobs:
  build_ios:
    # The iOS SDK pack (27.2) hard-requires Xcode 27.2; same runner as daily-plants
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj', 'src/Directory.Packages.props', 'src/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET workloads
        run: dotnet workload restore "$SOLUTION_FILE"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download iOS platform
        # https://github.com/actions/runner-images/issues/13275
        run: xcodebuild -downloadPlatform iOS

      - name: Import signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Replace appsettings.json with production config
        env:
          APPSETTINGS_CONTENT: ${{ secrets.APPSETTINGSPROD }}
        run: printenv APPSETTINGS_CONTENT > "$PROJECT_PATH/appsettings.json"

      - name: Publish signed IPA
        run: |
          dotnet publish "$PROJECT_FILE" -c Release -f "$TFM" -r ios-arm64 \
            -p:TargetFrameworks="$TFM" \
            -p:ApplicationVersion=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER)) \
            -p:AdMobIosAppId='${{ vars.ADMOB_IOS_APP_ID }}' \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ secrets.APPLE_CODESIGN_KEY }}" \
            -p:CodesignTeamId="${{ secrets.APPLE_TEAM_ID }}" \
            -p:CodesignProvision="${{ vars.APPLE_PROVISIONING_PROFILE_NAME }}"

      - name: Locate the IPA
        id: ipa
        run: |
          set -euo pipefail
          f="$(find "$PROJECT_PATH/bin/Release/$TFM/ios-arm64" -name '*.ipa' | head -1 || true)"
          [ -n "$f" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: iOS_IPA
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          app-type: ios
          backend: appstore-api
          # Otherwise every build stalls at "Waiting for Export Compliance"
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'

      - name: Remove production settings
        if: ${{ always() }}
        run: rm -f "$PROJECT_PATH/appsettings.json"
