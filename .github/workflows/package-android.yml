name: Build Android Packages

# Signed AAB uploaded to the Google Play internal track.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLUTION_FILE: src/SmsTicket.slnx
  PROJECT_PATH: src/SmsTicket
  PROJECT_FILE: src/SmsTicket/SmsTicket.csproj
  TFM: net10.0-android
  PACKAGE_NAME: com.sphereline.smsticketandroid
  GOOGLE_PLAY_TRACK_STATUS: draft  # completed, draft, halted, inProgress
  # versionCode must grow with every upload; the csproj value (500001) is the floor
  VERSION_CODE_BASE: 500001

jobs:
  build_android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj', 'src/Directory.Packages.props', 'src/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET workloads
        run: dotnet workload restore "$SOLUTION_FILE"

      - name: Decode upload keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"

      - name: Replace appsettings.json with production config
        env:
          APPSETTINGS_CONTENT: ${{ secrets.APPSETTINGSPROD }}
        run: printenv APPSETTINGS_CONTENT > "$PROJECT_PATH/appsettings.json"

      - name: Publish AAB (signed)
        run: |
          dotnet publish "$PROJECT_FILE" -c Release -f "$TFM" \
            -p:ApplicationVersion=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER)) \
            -p:AndroidPackageFormat=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore" \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_STORE_PASSWORD }}'

      - name: Assert exactly one signed AAB
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=("$PROJECT_PATH/bin/Release/$TFM/publish/"*-Signed.aab)
          [ "${#signed[@]}" -eq 1 ] || { echo "::error::expected exactly 1 *-Signed.aab, found ${#signed[@]}"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: Android_AAB
          path: ${{ env.PROJECT_PATH }}/bin/Release/${{ env.TFM }}/publish/*-Signed.aab
          if-no-files-found: error

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.PROJECT_PATH }}/bin/Release/${{ env.TFM }}/publish/*-Signed.aab
          track: internal
          status: ${{ env.GOOGLE_PLAY_TRACK_STATUS }}

      - name: Remove keystore and production settings
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$PROJECT_PATH/appsettings.json"
